<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeits-Belohnung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffcc00;
        }
        .photo-hint {
            background-color: #444;
            border-left: 4px solid #ffcc00;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.4;
            text-align: left;
        }
        video {
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            outline: none;
            background: #000;
        }
        .btn {
            background-color: #ffcc00;
            color: #222;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Deine Belohnung!</h2>
        
        <div class="photo-hint">
            📸 <strong>P.S.:</strong> Wir freuen uns riesig über all eure Fotos und Videos vom Feiern! Aber für die Trauung gilt: Handy in die Tasche, zurücklehnen und genießen – das macht unser Profi. Ihr sollt schließlich auch was von uns haben! 😉
        </div>

        <p>Hier ist dein zufälliges Video:</p>

        <video id="rewardVideo" controls playsinline>
            <source id="videoSource" src="" type="video/mp4">
            Dein Browser unterstützt kein Video.
        </video>

        <br>
        <button class="btn" onclick="zeigeZufallsVideo()">Anderes Video zeigen</button>
    </div>

    <script>
        function zeigeZufallsVideo() {
            // Die Dateinamen deiner 3 Videos (müssen im selben Ordner liegen)
            const videoListe = [
                "video1.mp4",
                "video2.mp4",
                "video3.mp4"
            ];

            // Zufälligen Index (0, 1 oder 2) auswählen
            const zufallsIndex = Math.floor(Math.random() * videoListe.length);
            const gewaehltesVideo = videoListe[zufallsIndex];

            // Video in den Player laden und abspielen
            const videoSource = document.getElementById('videoSource');
            const videoPlayer = document.getElementById('rewardVideo');
            
            videoSource.src = gewaehltesVideo;
            videoPlayer.load();
            videoPlayer.play().catch(error => {
                console.log("Autoplay wurde vom Browser blockiert:", error);
            });
        }

        // Starte die Funktion automatisch, sobald die Seite geladen ist
        window.onload = function() {
            zeigeZufallsVideo();
        };
    </script>

</body>
</html>
